name: Generate Node.js packages
run-name: Generate Node.js ${{ inputs.VERSION || '22.23.5 and 24.22.3' }}
on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Node.js version to build and upload'
        required: true
        default: '24.22.3'
      PUBLISH_RELEASES:
        description: 'Whether to publish releases'
        required: true
        type: boolean
        default: false
  pull_request:
    paths-ignore:
      - 'versions-manifest.json'
      - 'LICENSE'
      - '**.md'
    branches:
      - 'main'

jobs:
  node:
    name: Node ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.VERSION && format('["{0}"]', inputs.VERSION) || '["22.23.5", "24.22.3"]') }}
    uses: actions/versions-package-tools/.github/workflows/build-tool-packages.yml@main
    with:
      tool-name: 'node'
      tool-version: ${{ matrix.version }}
      publish-release: ${{ inputs.PUBLISH_RELEASES || false }}
    secrets: inherit
